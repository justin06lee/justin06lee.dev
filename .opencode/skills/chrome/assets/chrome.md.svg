<svg width="630" height="880" viewBox="0 0 630 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="chrome.md — a trading card of straight chrome foil">
<!-- A pokemon-card-ratio slab of the registry's chrome foil, layered exactly
     like CHROME_FOIL_STYLE in chrome.tsx: pastel spectrum (bottom), 48deg
     pinstripe texture (middle), 115deg white shine streak sweeping right to
     left on the chrome-shine 5s cubic-bezier(.4,0,.6,1) loop (top). -->
<defs>
<clipPath id="card"><rect x="0" y="0" width="630" height="880" rx="24"/></clipPath>
<linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="hsl(195,95%,88%)"/>
<stop offset="14%" stop-color="hsl(170,75%,82%)"/>
<stop offset="26%" stop-color="hsl(85,70%,84%)"/>
<stop offset="38%" stop-color="hsl(50,95%,86%)"/>
<stop offset="50%" stop-color="hsl(25,90%,88%)"/>
<stop offset="62%" stop-color="hsl(345,80%,88%)"/>
<stop offset="74%" stop-color="hsl(310,70%,88%)"/>
<stop offset="86%" stop-color="hsl(265,70%,88%)"/>
<stop offset="100%" stop-color="hsl(210,90%,88%)"/>
</linearGradient>
<!-- repeating-linear-gradient(48deg, transparent 0 1px, white.12 1px 2px, black.05 2px 4px),
     scaled 1.5x so the stripes survive the viewBox-to-display downscale -->
<pattern id="tex" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-42)">
<rect x="1.5" y="0" width="1.5" height="6" fill="#ffffff" fill-opacity="0.12"/>
<rect x="3" y="0" width="3" height="6" fill="#000000" fill-opacity="0.05"/>
</pattern>
<!-- 115deg shine across a 220%-wide layer, same stops as the component -->
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-45" y1="96" x2="1431" y2="784">
<stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="48%" stop-color="#ffffff" stop-opacity="0.85"/>
<stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
<stop offset="52%" stop-color="#ffffff" stop-opacity="0.85"/>
<stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
.shine{animation:sweep 5s cubic-bezier(.4,0,.6,1) infinite}
@keyframes sweep{from{transform:translateX(378px)}to{transform:translateX(-1890px)}}
@media (prefers-reduced-motion:reduce){.shine{animation:none;transform:translateX(-378px)}}
</style>
<g clip-path="url(#card)">
<rect x="0" y="0" width="630" height="880" fill="url(#spec)"/>
<rect x="0" y="0" width="630" height="880" fill="url(#tex)"/>
<rect class="shine" x="0" y="0" width="1386" height="880" fill="url(#shine)"/>
</g>
<rect x="1" y="1" width="628" height="878" rx="23" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="2"/>
</svg>
